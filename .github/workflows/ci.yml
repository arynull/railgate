name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Smoke tests
        run: npm test

      - name: Boot check (real server + /health poll)
        run: |
          PORT=3000 node server.js > server.log 2>&1 & echo $! > server.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/health
          kill "$(cat server.pid)"
